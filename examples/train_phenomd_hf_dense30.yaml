# Exact-GP at the actual target density (30 mass ratios, spacing 0.03) that
# CLAUDE.md's log-det bias analysis calls for -- previously assumed
# impossible for Cholesky-based ExactGPSurrogate ("safe to N~2000") and only
# attempted via SparseGPSurrogate (examples/train_phenomd_hf_sparse.yaml),
# which after extensive tuning (M, iterations, ngd_lr) plateaued at
# K/C~176-194, still 8x worse than the 10-mass-ratio exact-GP baseline
# (K/C=22).
#
# The "safe to N~2000" ceiling was a CPU-era assumption baked into a
# hardcoded gpytorch.settings.max_cholesky_size(2000) in exact.py, never
# actually stress-tested. Now that a GPU is available (RTX 3050 Ti, 4GB),
# a smoke test confirmed N=6000 Cholesky trains cleanly in ~4 min for 10
# L-BFGS iterations, with no CG fallback/NaN -- cholesky_size is now a
# proper config knob (see exact.py) instead of hardcoded, set here to
# N_total=6000 to force exact Cholesky at this density.
#
# Same q-grid and ls_min_time/noise_floor_rel as the sparse config for a
# fair, direct comparison; zero mean function per the earlier mean-function
# experiment finding no benefit at M=60 Msun.
#
# Usage: heron train --settings examples/train_phenomd_hf_dense30.yaml
# Requires: lalsuite (pip install heron[lal]); a CUDA GPU is strongly
# recommended (CPU Cholesky at N=6000 would be far too slow).

logging:
  level: info

training:
  mode: fixed
  model: exact

  approximant: IMRPhenomD

  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  # Same 30-mass-ratio grid as examples/train_phenomd_hf_sparse.yaml,
  # spacing 0.03. N_total = 30 * 200 = 6000.
  mass_ratios: [0.10, 0.13, 0.16, 0.19, 0.22, 0.25, 0.28, 0.31, 0.34, 0.37,
                0.40, 0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67,
                0.70, 0.73, 0.76, 0.79, 0.82, 0.85, 0.88, 0.91, 0.94, 0.97]

  n_samples: 200

  nu: 2.5
  output_scale: 1.0e+27
  optimizer: lbfgs
  iterations: 80
  device: cuda

  # alpha=0.625 is the project standard for ExactGPSurrogate (unlike the
  # sparse config, which needed 0.375 to fix its SVGP-specific fit issue).
  warping:
    type: chirp
    alpha: 0.625

  # ls_min_q set to the grid spacing (0.03, same as the sparse config).
  ls_min_q: 0.03
  ls_min_time: 0.030
  noise_floor_rel: 1.0e-3

  # Force exact Cholesky at N=6000 -- see exact.py's cholesky_size param.
  # Smoke-tested clean (no CG NaN) at this size on GPU.
  cholesky_size: 6000

  checkpoint: checkpoints/phenomd_nonspinning_dense30.pt
  save_training_data: checkpoints/phenomd_nonspinning_dense30_data.h5

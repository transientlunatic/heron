# TaylorT2 (1PN) mean-function variant of
# examples/train_phenomd_hf_dense30_phase_amplitude.yaml -- identical grid
# and hyperparameters, only the amplitude/phase mean functions upgraded
# newtonian -> taylort2.
#
# NOTE before running (2026-07-15, scripts/probe_phase_mean_residuals.py on
# the saved dense30 training data): the diagnostic predicts a NULL result.
# At M=60 Msun the TaylorT2 phase mean only reduces the phase GP's
# per-q-demeaned inspiral residual by ~12% vs zero mean (94.2 -> 82.4 rad;
# newtonian gets 85.8), and the amplitude mean by ~8% -- both PN truncations
# decohere over the short in-band chirp, the same mass-dependent failure
# documented for the strain-domain means. The zero-after-merger phase cutoff
# is NOT a discontinuity problem (PN convention pins Phi=0 at merger;
# measured residual jump <= 2.5 rad), so this config will not fix the
# merger/ringdown defect either. Kept as a ready-to-run confirmation if the
# end-to-end check is ever wanted; expect no measurable change vs the
# newtonian-mean checkpoint.
#
# Usage: heron train --settings examples/train_phenomd_hf_dense30_phase_amplitude_taylort2.yaml
# Requires: lalsuite (pip install heron[lal])

logging:
  level: info

training:
  mode: fixed
  model: phase_amplitude

  approximant: IMRPhenomD

  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  mass_ratios: [0.10, 0.13, 0.16, 0.19, 0.22, 0.25, 0.28, 0.31, 0.34, 0.37,
                0.40, 0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67,
                0.70, 0.73, 0.76, 0.79, 0.82, 0.85, 0.88, 0.91, 0.94, 0.97]

  n_samples: 200

  nu: 2.5
  optimizer: lbfgs
  iterations: 80
  device: cuda

  warping:
    type: chirp
    alpha: 0.625

  ls_min_q: 0.03
  ls_min_time: 0.015
  noise_floor_rel: 1.0e-3

  cholesky_size: 6000

  mean_function_amplitude:
    type: taylort2
  mean_function_phase:
    type: taylort2

  checkpoint: checkpoints/phenomd_nonspinning_dense30_phase_amplitude_taylort2.pt
  save_training_data: checkpoints/phenomd_nonspinning_dense30_phase_amplitude_taylort2_data.h5

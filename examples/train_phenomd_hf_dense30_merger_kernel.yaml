# Matched-density comparison against checkpoints/phenomd_nonspinning_dense30_lsmin015.pt
# (the current best ExactGPSurrogate checkpoint) to test whether a
# non-stationary time kernel (short lengthscale near merger, long in the
# inspiral) fixes the merger/ringdown reconstruction defect documented in
# CLAUDE.md, without needing another time-warping revision.
#
# Same 30-mass-ratio/N=6000 grid, same far-region floor (ls_min_q=0.03,
# ls_min_time=0.015), same noise_floor_rel/cholesky_size as lsmin015 -- the
# only difference is merger_kernel: true plus its three extra
# hyperparameters, so any change in mismatch/phase-drift near merger is
# attributable to the kernel, not a confound from also changing the grid.
#
# merger_kernel hyperparameter choices:
#  - ls_min_time_merger=0.01: ~2x dense30's largest per-q warped-time
#    spacing (0.0035-0.0062, measured directly from the lsmin015
#    checkpoint's train_x) -- same "2x spacing" rule used to derive
#    ls_min_time=0.015 itself, applied to the near-merger region.
#  - merger_center=0.0: exact, not tuned -- every warping in this codebase
#    maps raw t=0 (merger, per mean.py's convention) to warped 0.
#  - merger_width_init=0.03: unwarp(+-0.037) ~= +-20ms physical, which is
#    the merger/ringdown window CLAUDE.md's phase_amplitude investigation
#    identified as where the dominant post-merger defect lives -- 0.03 is
#    the same order of magnitude. NonstationaryMaternKernel derives
#    min_width=0.0075 and max_width=0.09 from this automatically.
#
# Usage: heron train --settings examples/train_phenomd_hf_dense30_merger_kernel.yaml
# Requires: lalsuite (pip install heron[lal]); GPU strongly recommended
# (N=6000 Cholesky) -- run on wiay, not the local laptop GPU (see memory).

logging:
  level: info

training:
  mode: fixed
  model: exact

  approximant: IMRPhenomD

  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  mass_ratios: [0.10, 0.13, 0.16, 0.19, 0.22, 0.25, 0.28, 0.31, 0.34, 0.37,
                0.40, 0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67,
                0.70, 0.73, 0.76, 0.79, 0.82, 0.85, 0.88, 0.91, 0.94, 0.97]

  n_samples: 200

  nu: 2.5
  output_scale: 1.0e+27
  optimizer: lbfgs
  iterations: 80
  device: cuda

  warping:
    type: chirp
    alpha: 0.625

  ls_min_q: 0.03
  ls_min_time: 0.015
  noise_floor_rel: 1.0e-3

  cholesky_size: 6000

  merger_kernel: true
  ls_min_time_merger: 0.01
  merger_center: 0.0
  merger_width_init: 0.03

  checkpoint: checkpoints/phenomd_nonspinning_dense30_merger_kernel.pt
  save_training_data: checkpoints/phenomd_nonspinning_dense30_merger_kernel_data.h5

# Same as train_phenomd_hf_dense30.yaml, but with ls_min_time halved
# (0.030 -> 0.015). The original 0.030 floor was inherited unchanged from
# the much sparser original N=1000/5-q grid (examples/train_phenomd_hf.yaml)
# and never rescaled when the grid densified to N=6000/30-q here. Checking
# the actual warped-time spacing in the trained dense30 checkpoint shows it
# ranges 0.0035-0.0062 across the q grid -- the 0.030 floor is 5-8x that,
# and the trained lengthscale sits pinned exactly on it (0.030003), meaning
# the optimizer wants to go finer than the floor allows.
#
# 0.015 is a conservative single step (not the theoretical minimum of
# ~2x the coarsest spacing, ~0.0125) chosen specifically to leave headroom
# above the point where individual training points would start being
# treated independently (the ls_min_q=0.03 failure mode documented in
# CLAUDE.md, applied here to time). ls_min_q, noise_floor_rel, and
# everything else are left unchanged from dense30 so the effect of this one
# change is interpretable.
#
# Verify before trusting: (1) trained lengthscale should land inside 0.015,
# not pinned on it again; (2) scripts/mismatch_vs_mass_ratio.py across the
# FULL q range -- watch for regression in the previously-good q>=0.6 region,
# the signature of overfitting seen in the adaptive-warping ablation;
# (3) scripts/probe_phase_drift.py -- secular phase drift should shrink at
# the bad q's (0.25-0.45).
#
# Usage: heron train --settings examples/train_phenomd_hf_dense30_lsmin015.yaml

logging:
  level: info

training:
  mode: fixed
  model: exact

  approximant: IMRPhenomD

  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  mass_ratios: [0.10, 0.13, 0.16, 0.19, 0.22, 0.25, 0.28, 0.31, 0.34, 0.37,
                0.40, 0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67,
                0.70, 0.73, 0.76, 0.79, 0.82, 0.85, 0.88, 0.91, 0.94, 0.97]

  n_samples: 200

  nu: 2.5
  output_scale: 1.0e+27
  optimizer: lbfgs
  iterations: 80
  device: cuda

  warping:
    type: chirp
    alpha: 0.625

  ls_min_q: 0.03
  ls_min_time: 0.015
  noise_floor_rel: 1.0e-3

  cholesky_size: 6000

  checkpoint: checkpoints/phenomd_nonspinning_dense30_lsmin015.pt
  save_training_data: checkpoints/phenomd_nonspinning_dense30_lsmin015_data.h5

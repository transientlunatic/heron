# KroneckerDemodGPSurrogate: the demodulated (heterodyned) residual model
# of examples/train_phenomd_hf_dense30_demod.yaml, rebuilt with
#
#   * geometric units -- (q, tau = t/M) -> h D / M; total mass and distance
#     become analytic rescalings at predict time (no output_scale, no
#     total-mass GP dimension, one reference waveform per q for every M);
#   * a Kronecker product grid -- every q sampled at the same warped-tau
#     nodes, so exact GP inference costs O(n_q^3 + n_tau^3): trains in
#     seconds on a CPU, no cholesky_size / GPU needed;
#   * grid-derived lengthscale floors (ls_min_q / ls_min_time: null);
#   * low-rank covariance factors for the Woodbury likelihood
#     (NetworkLikelihood(..., waveform_covariance="lowrank")).
#
# Same oracle/reference pair and the same 30 mass ratios as the dense30
# demod checkpoint, so the mismatch scans are directly comparable
# (scripts/validate_demod_kron.py).
#
# Usage: heron train --settings examples/train_phenomd_dense30_demod_kron.yaml
# Requires: lalsuite.

logging:
  level: info

training:
  model: demod_kron
  approximant: IMRPhenomD          # oracle (training strain)
  base_approximant: IMRPhenomXAS   # reference, evaluated exactly at predict time

  mass_ratios: [0.10, 0.13, 0.16, 0.19, 0.22, 0.25, 0.28, 0.31, 0.34, 0.37,
                0.40, 0.43, 0.46, 0.49, 0.52, 0.55, 0.58, 0.61, 0.64, 0.67,
                0.70, 0.73, 0.76, 0.79, 0.82, 0.85, 0.88, 0.91, 0.94, 0.97]

  # Residual support in units of M. -5000 M is ~1.48 s before merger at
  # 60 M_sun (every q in the grid starts earlier than that at f_low=20 Hz);
  # +100 M is ~30 ms after merger, well into the ringdown tail. A fixed
  # physical segment spans MORE tau at lower total mass: choose tau_window
  # for the lightest system you will analyse (and lower f_low to match).
  tau_window: [-5000.0, 100.0]
  n_tau: 200

  reference_mass: 60.0
  reference_distance: 100.0
  f_low: 20.0

  warping:
    alpha: 0.625      # tau -> Newtonian phase (Phi ~ tau^(5/8))
    tau_ref: 338.4    # 0.1 s at 60 M_sun

  q_warping: none
  nu: 2.5
  ls_min_q: null      # derived: largest q spacing
  ls_min_time: null   # derived: 2x largest warped-tau spacing
  noise_floor_rel: 1.0e-6
  iterations: 200
  n_restarts: 0

  checkpoint: checkpoints/phenomd_nonspinning_dense30_demod_kron.pt

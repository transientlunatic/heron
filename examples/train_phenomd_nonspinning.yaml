# Train a non-spinning IMRPhenomD GP surrogate.
# Usage: heron train --settings examples/train_phenomd_nonspinning.yaml
#
# Requires: lalsuite (pip install heron[lal])

logging:
  level: info

training:
  mode: fixed
  model: exact

  approximant: IMRPhenomD

  # Fixed physical parameters (spins default to zero)
  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  # Sample 20 mass ratios in [0.1, 1.0]
  mass_ratios: [0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55,
                0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  n_samples: 128

  # GP hyperparameters
  nu: 2.5
  output_scale: 1.0e+27
  optimizer: lbfgs                # lbfgs (recommended) | adam
  iterations: 100                 # L-BFGS steps (use ~1000 for adam)
  device: cpu

  warping:
    type: chirp
    alpha: 0.625

  checkpoint: checkpoints/phenomd_nonspinning.pt
  save_training_data: checkpoints/phenomd_nonspinning_data.h5

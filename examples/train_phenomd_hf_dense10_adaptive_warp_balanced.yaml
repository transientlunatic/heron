# Second ablation on top of train_phenomd_hf_dense10_adaptive_warp.yaml:
# same MassRatioChirpTimeWarping, but ref_mass_ratio=0.138 instead of 1.0.
#
# The first attempt (ref_mass_ratio=1.0, equal mass) fixed the phase-drift
# hump at q=0.25-0.45 (3-10x less drift) but regressed q=0.48-0.93 mismatch
# by ~84% on average, because eta(q)=q/(1+q)^2 is monotonic increasing on
# (0,1] and anchoring at q=1 (its max) makes the t_ref correction one-sided
# -- every q<1 gets *expanded* t_ref, nothing gets compressed. The single
# floor-pinned kernel time lengthscale (ls_min_time=0.03, confirmed pinned
# in both the old and new checkpoints) then has an even wider total warped
# range to cover, and the high-q half of the grid loses out.
#
# ref_mass_ratio=0.138 is the point where eta(ref) is the *geometric mean*
# of eta(0.05) and eta(0.95) (this grid's extremes) -- i.e. it equalises the
# log-space correction magnitude at both ends (correction x2.35 at q=0.05,
# x0.43 -- i.e. a real compression -- at q=0.95), instead of leaving one end
# untouched. See CLAUDE.md / memory mean_function_low_q_defect.md for the
# full ref_mass_ratio=1.0 result this is following up on.
#
# Usage: heron train --settings examples/train_phenomd_hf_dense10_adaptive_warp_balanced.yaml
# Requires: lalsuite (pip install heron[lal])

logging:
  level: info

training:
  mode: fixed
  model: exact

  approximant: IMRPhenomD

  total_mass: 60.0        # solar masses
  distance: 100.0         # Mpc

  mass_ratios: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95]

  n_samples: 200

  nu: 2.5
  output_scale: 1.0e+27
  optimizer: lbfgs
  iterations: 80
  device: cpu

  warping:
    type: chirp_adaptive
    alpha: 0.625
    ref_mass_ratio: 0.138

  ls_min_q: 0.1
  ls_min_time: 0.030
  noise_floor_rel: 1.0e-3

  checkpoint: checkpoints/phenomd_nonspinning_dense10_adaptivewarp_balanced.pt
  save_training_data: checkpoints/phenomd_nonspinning_dense10_adaptivewarp_balanced_data.h5

name: Tests
on:
  push:
    branches:
      - master
      - v*-preview
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      
    - name: Set up Python 3.10
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements_test.txt
        
    - name: Run Tests
      run: |
        # The suite is written for pytest; "slow" marks the long
        # integration tests (e.g. dynesty), excluded from the fast suite.
        python -m pytest tests/ -m "not slow"

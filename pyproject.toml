[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "heron-model"
description = "Probabilistic waveform emulation with uncertainty for gravitational wave astronomy."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "ISC License (ISCL)"}
authors = [
    {name = "Daniel Williams", email = "daniel.williams@ligo.org"}
]
keywords = ["heron", "gravitational-waves", "gaussian-processes", "waveform-modelling"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=2.2.0",
    "torch",
    "gpytorch",
    "scipy",
    "h5py",
    "pyyaml",
    "click",
    "tqdm",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/transientlunatic/heron"

[project.optional-dependencies]
lal = [
    "lalsuite",
    "astropy>=5.0",
]
plot = [
    "matplotlib>=3.9.3",
]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "hypothesis",
    "astropy>=5.0",
]

[project.scripts]
heron = "heron.cli:heron"

[tool.setuptools]
packages = [
    "heron",
    "heron.models",
    "heron.models.gp",
    "heron.models.reference",
    "heron.training",
    "heron.evaluation",
]
include-package-data = true
zip-safe = true

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.flake8]
exclude = ["docs"]

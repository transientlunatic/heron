# Injection study with IMRPhenomPv2_FakeUncertainty
# Test case: q=0.5, M=20 Msun, d=100 Mpc
#
# Usage:
#   heron injection --settings fake_uncertainty_test_q05.yaml
#   heron inference --settings fake_uncertainty_test_q05.yaml

logging:
    level: info

pages directory: /data/www.astro/daniel/heron-paper/fake-uncertainty/q05/

injection:
    duration: 4
    sample rate: 4096
    epoch: 3998
    parameters:
        luminosity_distance: 100
        gpstime: 4000
        mass_ratio: 0.5
        total_mass: 20
        ra: 1.0
        dec: 0.3
        psi: 0
        phase: 0
        theta_jn: 0
    waveform: IMRPhenomPv2
    channel: Injection
    interferometers:
        H1: AdvancedLIGOHanford
        L1: AdvancedLIGOLivingston
    psds:
        H1: AdvancedLIGO
        L1: AdvancedLIGO

inference:
    name: fake-uncertainty-q05
    data:
        data files:
            H1: H1_injection.gwf
            L1: L1_injection.gwf
        channels:
            H1: H1:Injection
            L1: L1:Injection

    event time: 4000
    segment length: 2
    after merger: 0.1

    waveform:
        model: IMRPhenomPv2_FakeUncertainty

    interferometers:
        H1: AdvancedLIGOHanford
        L1: AdvancedLIGOLivingston

    psds:
        H1: AdvancedLIGO
        L1: AdvancedLIGO

    fixed_parameters:
        total_mass: 20
        gpstime: 4000

    priors:
        mass_ratio:
            name: mass_ratio
            function: Uniform
            minimum: 0.2
            maximum: 0.8

        luminosity_distance:
            function: Uniform
            name: luminosity_distance
            minimum: 50.0
            maximum: 200.0

        ra:
            name: ra
            function: Uniform
            minimum: 0.0
            maximum: 6.283185
            boundary: periodic

        dec:
            name: dec
            function: Cosine

        theta_jn:
            name: theta_jn
            function: Sine

        psi:
            name: psi
            function: Uniform
            minimum: 0.0
            maximum: 3.14159

        phase:
            name: phase
            function: Uniform
            minimum: 0.0
            maximum: 6.283185
            boundary: periodic

    likelihood:
        function: TimeDomainUncertaintyLikelihood
        timing basis: [H1, L1]
        sampling rate: 512

    sampler:
        sampler: nessai
        live points: 1000
        maximum uninformed: 2000
        resume: true
        checkpointing: true
        checkpointing interval: 3600
        logging interval: 10
        log on iteration: true
        seed: 1234
        flow class: FlowProposal

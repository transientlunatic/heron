# ==========================================
# Events for GPR model tests
# ==========================================
kind: event
name: gpr-q05
interferometers:
  - H1
  - L1
event time: 4000

---

# ==========================================
# Test Case 5: q=0.5 with GPR Model
# ==========================================

# Step 1: Train the GPR model
kind: analysis
name: training-gpr
pipeline: heron training
event: gpr-q05
comment: "Train Matern GPR waveform model"
status: ready
training:
  approximant: IMRPhenomPv2
  mass_ratios: [0.1, 0.3, 0.5, 0.7, 0.8, 1.0]
  total_mass: 20
  distance: 100
  n_samples: 200
  nu: 2.5
  iterations: 400
  checkpoint: heron_matern_checkpoint.pt
  warping:
    type: chirp
    alpha: 0.625
    t_ref: 0.1

---

# Step 2: Create injection
kind: analysis
name: injection-q05-gpr
pipeline: heron injection
event: gpr-q05
comment: "Create injection for q=0.5 GPR test"
status: ready
injection:
  parameters:
    luminosity_distance: 100
    gpstime: 4000
    mass_ratio: 0.5
    total_mass: 20
    ra: 1.0
    dec: 0.3
    psi: 0
    phase: 0
    theta_jn: 0
  duration: 4
  sample rate: 4096
  psds:
    H1: AdvancedLIGO
    L1: AdvancedLIGO
  waveform: IMRPhenomPv2

---

kind: analysis
name: inference-q05-gpr
pipeline: heron
event: gpr-q05
comment: "Inference with GPR (Matern + chirp warping) for q=0.5"
status: ready
needs:
  - training-gpr
  - injection-q05-gpr
event time: 4000
segment length: 2
after merger: 0.1
waveform:
  model: HeronGPR
  checkpoint: /path/to/trained/heron_matern_checkpoint.pt
likelihood:
  function: TimeDomainUncertaintyLikelihood
  timing basis: [H1, L1]
  sampling rate: 512
fixed_parameters:
  total_mass: 20
  gpstime: 4000
priors:
  mass_ratio:
    name: mass_ratio
    function: Uniform
    minimum: 0.2
    maximum: 0.8
  luminosity_distance:
    function: Uniform
    name: luminosity_distance
    minimum: 50.0
    maximum: 200.0
  ra:
    name: ra
    function: Uniform
    minimum: 0.0
    maximum: 6.283185
    boundary: periodic
  dec:
    name: dec
    function: Cosine
  theta_jn:
    name: theta_jn
    function: Sine
  psi:
    name: psi
    function: Uniform
    minimum: 0.0
    maximum: 3.14159
  phase:
    name: phase
    function: Uniform
    minimum: 0.0
    maximum: 6.283185
    boundary: periodic
sampler:
  sampler: nessai
  live points: 1000
  maximum uninformed: 2000
  resume: true
  checkpointing: true
  checkpointing interval: 3600
  logging interval: 10
  log on iteration: true
